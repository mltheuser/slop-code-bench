type: momo
version: "0.1"
server_dist: /Users/malteheuser/Develop/Private/momo-codes/momo-agent/server/build/install/server
harness_path: /Users/malteheuser/Develop/Private/momo-codes/momo-agent/lib/examples/coder
ai_router_base_url: http://host.docker.internal:8787
# Per the momo-codes run-budget decision: the agent runs until its own
# library budgets end it; the benchmark imposes no step or cost limits.
# No harness-side limits: momo self-bounds every run (256 turns, 3-day wall
# clock, 24h per tool call). run_idle_timeout is an opt-in escape hatch for a
# run that reports "running" while emitting nothing at all; 0 = disabled.
run_idle_timeout: 0
cost_limits:
  cost_limit: 0
  step_limit: 0
  net_cost_limit: 0
